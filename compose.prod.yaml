# Production: docker compose -f compose.prod.yaml up -d --build   (xem docs/deploy.md)
# Mọi biến lấy từ .env (hoặc file chỉ định bằng APP_ENV_FILE).

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  nginx:
    image: ${APP_IMAGE:-quan-an-mini}-nginx:latest
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
      target: nginx
    environment:
      SERVER_NAME: ${SERVER_NAME:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - storage:/var/www/html/storage:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging: *logging

  app:
    image: ${APP_IMAGE:-quan-an-mini}:latest
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
      target: app
    env_file: ${APP_ENV_FILE:-.env}
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL:-256M}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *logging

  # Gia hạn chứng chỉ Let's Encrypt (cấp lần đầu: make prod-ssl)
  certbot:
    image: certbot/certbot:latest
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    restart: unless-stopped
    logging: *logging

  # Sao lưu MySQL + ảnh upload mỗi ngày vào ./backups
  backup:
    image: mysql:8.4
    entrypoint: ["/bin/bash", "/usr/local/bin/backup.sh"]
    command: ["loop"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PWD: ${DB_ROOT_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./docker/prod/backup.sh:/usr/local/bin/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - storage:/storage:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  storage:
  mysql-data:
  letsencrypt:
  certbot-www:
